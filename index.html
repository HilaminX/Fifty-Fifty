<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fifty-Fifty</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fifty-Fifty">
<meta name="theme-color" content="#F3F1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141C26" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F1EC; --surface:#FFFFFF; --ink:#1E2A38; --muted:#5E6875; --line:#DDD8CC;
  --plus:#1F7A5A; --minus:#B83A52; --accent:#FFC93C; --accent-ink:#1E2A38; --link:#8A5604;
  --font:"Familjen Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141C26; --surface:#1E2A38; --ink:#F2EEE4; --muted:#A3ADB8; --line:#2E3B4B;
    --plus:#4CC395; --minus:#F07D93; --accent:#FFC93C; --accent-ink:#141C26; --link:#FFC93C;
  }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{height:100%}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:var(--font); font-size:17px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0px) 0 calc(96px + env(safe-area-inset-bottom,0px));
}
#app{max-width:560px; margin:0 auto; padding:20px}
h1,h2{margin:0; line-height:1.1}
h1{font-size:2.2rem; font-weight:700; letter-spacing:-0.02em}
h2{font-size:1.15rem; font-weight:600; margin-bottom:12px}
a{color:var(--link)}
.num{font-variant-numeric:tabular-nums}

button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
label{display:block; font-size:.9rem; color:var(--muted); margin-bottom:14px}
input,select,textarea{
  display:block; width:100%; margin-top:6px; padding:12px 14px;
  background:var(--bg); border:1.5px solid var(--line); border-radius:12px; color:var(--ink);
}
input:focus,select:focus,textarea:focus{border-color:var(--accent); outline:none}
textarea{resize:vertical}

.primary{
  background:var(--accent); color:var(--accent-ink); border:0; border-radius:999px;
  padding:14px 22px; font-weight:600; text-decoration:none; display:inline-block;
}
.primary:disabled{opacity:.5}
.ghost{background:transparent; border:1.5px solid var(--line); border-radius:999px; padding:9px 16px; font-weight:500}
.danger{background:transparent; border:0; color:var(--minus); font-weight:600; padding:10px 4px; margin-right:auto}

.block{background:var(--surface); border-radius:20px; padding:20px; margin-top:20px}

/* Home */
.home-head{padding:24px 0 4px}
.home-head h1{font-size:3rem}
.home-head .logo{width:64px; height:64px; display:block; margin-bottom:14px; border-radius:16px}
.home-head p{color:var(--muted); max-width:34ch; margin:10px 0 0}
.groups{list-style:none; margin:0; padding:0}
.groups a{display:block; padding:14px 0; border-top:1px solid var(--line); text-decoration:none; color:var(--ink); font-weight:500}
.groups li:first-child a{border-top:0}

/* Group */
.back{text-decoration:none; font-weight:500; display:inline-block; padding:4px 0 12px}
.sub{color:var(--muted); margin:6px 0 0}
.mine{margin:22px 0 4px}
.mine .big{font-size:2.6rem; font-weight:700; letter-spacing:-0.02em; line-height:1}
.mine .lbl{color:var(--muted); font-size:.95rem; margin-top:4px}
.plus{color:var(--plus)} .minus{color:var(--minus)}
.row{display:flex; gap:12px; align-items:flex-end; margin-top:18px}
.row label{margin:0; flex:1}
.row select{padding:9px 12px}

.tabs{display:flex; gap:24px; margin:24px 0 8px; border-bottom:1.5px solid var(--line)}
.tabs button{background:none; border:0; padding:10px 0; color:var(--muted); font-weight:600; border-bottom:3px solid transparent; margin-bottom:-1.5px}
.tabs button[aria-selected="true"]{color:var(--ink); border-color:var(--ink)}

.list{list-style:none; margin:0; padding:0}
.day{color:var(--muted); font-size:.85rem; padding:18px 0 6px}
.item{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  background:var(--surface); border:0; border-radius:14px; padding:14px 16px; margin-bottom:6px;
}
.item .txt{flex:1; min-width:0}
.item strong{display:block; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.item small{display:block; color:var(--muted); font-size:.85rem}
.item .amt{font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap}
.item.pay{background:transparent; border:1.5px dashed var(--line)}

.bal{display:grid; grid-template-columns:minmax(70px,1fr) 2fr auto; gap:10px; align-items:center; padding:10px 0}
.bal .name{font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bal .amt{font-weight:600; font-variant-numeric:tabular-nums; text-align:right; min-width:84px}
.bar{display:grid; grid-template-columns:1fr 1fr; height:14px; border-left:0}
.bar .l{display:flex; justify-content:flex-end; border-right:2px solid var(--ink)}
.bar span{display:block; height:100%; border-radius:4px}
.bar .l span{background:var(--minus); border-radius:4px 0 0 4px}
.bar .r span{background:var(--plus); border-radius:0 4px 4px 0}

.settle{list-style:none; margin:0; padding:0}
.settle li{display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line)}
.settle li:first-child{border-top:0}
.settle .txt{flex:1}
.settle .ghost{padding:7px 14px; font-size:.9rem}

.inline{display:flex; gap:10px}
.inline input{margin:0}
.inline button{flex-shrink:0}

.empty{text-align:center; color:var(--muted); padding:48px 12px}
.empty .primary{margin-top:16px}
.loading{color:var(--muted); padding:48px 0; text-align:center}

.fab{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom,0px));
  width:min(520px, calc(100% - 40px)); padding:16px; font-size:1.05rem;
  box-shadow:0 8px 24px -8px var(--accent);
}

/* Sheet */
dialog{
  border:0; padding:0; background:var(--surface); color:var(--ink);
  width:100%; max-width:560px; max-height:92vh; margin:auto auto 0;
  border-radius:24px 24px 0 0; overflow:auto;
}
@media (min-width:640px){ dialog{margin:auto; border-radius:24px} }
dialog::backdrop{background:rgba(10,20,30,.45)}
dialog[open]{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px); opacity:0}}
@media (prefers-reduced-motion:reduce){ dialog[open]{animation:none} }
#expForm{padding:24px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.two{display:grid; grid-template-columns:1fr 1fr; gap:12px}
fieldset{border:0; padding:0; margin:4px 0 0}
legend{font-size:.9rem; color:var(--muted); margin-bottom:8px; padding:0}
.seg{display:inline-flex; background:var(--bg); border-radius:999px; padding:4px; margin-bottom:10px}
.seg button{border:0; background:transparent; padding:8px 16px; border-radius:999px; font-weight:600; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink)}
.srow{display:flex; align-items:center; gap:12px; margin:0; padding:9px 0; color:var(--ink); font-size:1rem; border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow span:first-of-type{flex:1}
.srow input[type=checkbox]{width:22px; height:22px; margin:0; accent-color:var(--accent); flex-shrink:0}
.srow input[inputmode]{width:110px; margin:0; padding:8px 10px; text-align:right}
.srow .amt{color:var(--muted); font-variant-numeric:tabular-nums}
.hint{font-size:.9rem; color:var(--muted); margin:8px 0 0}
.err{color:var(--minus); font-weight:500; min-height:1.2em; margin:12px 0 0}
.actions{display:flex; gap:10px; justify-content:flex-end; align-items:center; margin-top:16px}

#toast{
  position:fixed; left:50%; bottom:calc(90px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
  background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-weight:500;
  opacity:0; pointer-events:none; transition:opacity .2s; max-width:calc(100% - 40px); text-align:center;
}
#toast.show{opacity:1}

/* Gruppe: Kennzahlen, Status, Verlauf */
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:18px}
.stat{background:var(--surface); border-radius:14px; padding:10px 10px 11px; min-width:0}
.stat small{display:block; color:var(--muted); font-size:.8rem}
.stat b{display:block; font-size:clamp(.95rem, 4vw, 1.1rem); font-weight:700; font-variant-numeric:tabular-nums; margin-top:2px; line-height:1.25; overflow-wrap:anywhere}
.banner{border-radius:14px; padding:12px 14px; margin-top:16px; font-weight:500; font-size:.95rem}
.banner.ok{background:color-mix(in srgb, var(--plus) 14%, transparent); color:var(--plus)}
.banner.warn{background:color-mix(in srgb, var(--minus) 12%, transparent); color:var(--minus)}
.who{background:var(--surface); border-radius:16px; padding:16px; margin-top:16px}
.who p{margin:0 0 10px}
.who .sub{margin:12px 0 0}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{border:1.5px solid var(--line); background:var(--bg); border-radius:999px; padding:9px 18px; font-weight:600}
.linkbtn{background:none; border:0; padding:0; color:var(--link); font-weight:600; text-decoration:underline; text-underline-offset:3px}
.badge{display:inline-block; font-size:.72rem; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--accent); color:var(--accent-ink); vertical-align:middle; margin-left:8px}
.dot{display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--minus); margin-left:8px; vertical-align:middle}
.groups small{display:block; color:var(--muted); font-size:.85rem; font-weight:400; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.prow{display:grid; grid-template-columns:1fr auto; gap:2px 12px; padding:12px 0; border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.pname{font-weight:600}
.pnums{grid-column:1; color:var(--muted); font-size:.88rem; display:flex; gap:14px; flex-wrap:wrap}
.pnums b{color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums}
.pbal{grid-row:1 / span 2; grid-column:2; align-self:center; font-weight:700; font-variant-numeric:tabular-nums}
.loglist{list-style:none; margin:0; padding:0}
.loglist li{display:flex; gap:12px; align-items:center; padding:10px 0; border-top:1px solid var(--line); font-size:.95rem}
.loglist li:first-child{border-top:0}
.loglist li>div{flex:1; min-width:0}
.loglist small{display:block; color:var(--muted); font-size:.8rem; margin-top:2px}
.btnrow{display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; align-items:center}
.sm{padding:7px 14px; font-size:.9rem}
.dangerline{color:var(--minus); border-color:color-mix(in srgb, var(--minus) 45%, transparent)}
.check{display:flex; align-items:center; gap:10px; color:var(--ink); font-size:.95rem; margin:16px 0 0}
.check input{width:22px; height:22px; margin:0; accent-color:var(--accent); flex-shrink:0}
#formFields{border:0; padding:0; margin:0; min-width:0}
#formFields:disabled input, #formFields:disabled select{opacity:.75}
.archive summary{cursor:pointer; font-weight:600; font-size:1.15rem; list-style:none}
.archive summary::-webkit-details-marker{display:none}
.archive summary::after{content:" ›"; color:var(--muted)}
.archive[open] summary{margin-bottom:8px}
.lock{font-size:.75rem; margin-left:6px}
.settle .plus{font-weight:600; font-size:.9rem}

/* Reiseplan & Dokumente */
.tabs{overflow-x:auto; scrollbar-width:none; gap:22px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex-shrink:0}
.addline{display:block; width:100%; text-align:center; margin:14px 0 4px; cursor:pointer}
.upbtn{cursor:pointer}
.countdown{display:flex; align-items:baseline; gap:10px; background:var(--surface); border-radius:16px; padding:14px 18px; margin-top:14px}
.countdown b{font-size:2rem; font-weight:700; letter-spacing:-.02em; color:var(--link)}
.countdown span{color:var(--muted); font-weight:500}
.pitem{background:var(--surface); border-radius:14px; margin-bottom:6px; overflow:hidden}
.pitem.past{opacity:.6}
.pmain{display:flex; gap:12px; width:100%; text-align:left; background:none; border:0; padding:14px 16px; align-items:flex-start}
.picon{font-size:1.4rem; line-height:1.2; flex-shrink:0}
.ptxt{flex:1; min-width:0}
.ptxt strong{display:block; font-weight:600}
.ptxt small{display:block; color:var(--muted); font-size:.85rem; white-space:pre-line; margin-top:2px}
.ptime{display:block; color:var(--link); font-size:.82rem; font-weight:700; font-variant-numeric:tabular-nums}
.pextra{display:flex; flex-wrap:wrap; gap:6px; padding:0 16px 12px 52px}
.chipline{display:inline-flex; align-items:center; gap:4px; max-width:100%; background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:5px 12px; font-size:.82rem; color:var(--ink); text-decoration:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.badge.soft{background:var(--line); color:var(--ink)}
.day .badge{margin-left:8px}
.note{background:color-mix(in srgb, var(--accent) 16%, transparent); border-radius:14px; padding:12px 14px; margin-top:14px; font-size:.9rem}
.offl{color:var(--plus); font-size:.78rem; font-weight:700; white-space:nowrap}
.types{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px}
.types button{border:1.5px solid var(--line); background:var(--bg); border-radius:999px; padding:7px 12px; font-size:.88rem; font-weight:600; color:var(--muted)}
.types button[aria-pressed="true"]{border-color:var(--accent); background:var(--accent); color:var(--accent-ink)}
.opt{font-size:.78rem}
.pdocs{margin-top:4px}
.flabel{display:block; font-size:.9rem; color:var(--muted); margin-bottom:4px}
.pdocs .upbtn{display:inline-block; margin-top:10px}
#planFields{border:0; padding:0; margin:0; min-width:0}
#planForm{padding:24px 20px calc(20px + env(safe-area-inset-bottom,0px))}
dialog.viewer{max-width:900px; width:100%; height:100%; max-height:100%; margin:0 auto; border-radius:0; display:none; flex-direction:column}
dialog.viewer[open]{display:flex}
@media (min-width:640px){ dialog.viewer{height:92vh; margin:auto; border-radius:20px} }
.vhead{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px; border-bottom:1px solid var(--line)}
.vhead strong{flex:1 1 160px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.vbtns{display:flex; gap:8px}
.vbody{flex:1; overflow:auto; padding:12px; background:var(--bg); padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.vbody img, .vbody canvas{display:block; width:100%; height:auto; margin:0 auto 10px; border-radius:6px; background:#fff}

/* Startbild */
#splash{
  position:fixed; inset:0; z-index:100; background:#1E2A38; color:#FFC93C;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
  transition:opacity .45s ease, visibility .45s;
}
#splash.hide{opacity:0; visibility:hidden}
#splash svg{width:min(52vw,240px); height:auto; animation:pop .6s cubic-bezier(.2,.9,.3,1.3)}
#splash .splash-name{font-size:2.2rem; font-weight:700; letter-spacing:-0.02em; animation:rise .6s .15s both ease-out}
@keyframes pop{from{transform:scale(.7); opacity:0}}
@keyframes rise{from{transform:translateY(10px); opacity:0}}
@media (prefers-reduced-motion:reduce){ #splash svg,#splash .splash-name{animation:none} }
</style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs><clipPath id="spl"><rect width="100" height="200"/></clipPath><clipPath id="spr"><rect x="100" width="100" height="200"/></clipPath></defs>
    <g clip-path="url(#spl)">
      <circle cx="100" cy="100" r="92" fill="#FFC93C"/>
      <circle cx="100" cy="100" r="77" fill="none" stroke="#D99418" stroke-width="6.3"/>
      <text x="100" y="103" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="98" fill="#9A5F05">€</text>
    </g>
    <g clip-path="url(#spr)">
      <circle cx="100" cy="100" r="92" fill="#9A5F05"/>
      <circle cx="100" cy="100" r="77" fill="none" stroke="#D99418" stroke-width="6.3"/>
      <text x="100" y="103" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="98" fill="#FFC93C">€</text>
    </g>
  </svg>
  <div class="splash-name">Fifty-Fifty</div>
</div>
<div id="app"><p class="loading">Lade …</p></div>

<dialog id="sheet" aria-labelledby="sheetTitle">
  <form id="expForm" novalidate>
    <h2 id="sheetTitle">Neue Ausgabe</h2>
    <fieldset id="formFields">
      <label>Wofür?<input name="desc" required maxlength="80" placeholder="z. B. Einkauf Supermarkt" autocomplete="off"></label>
      <div class="two">
        <label>Betrag in €<input name="amount" inputmode="decimal" required placeholder="0,00" autocomplete="off"></label>
        <label>Datum<input type="date" name="date" required></label>
      </div>
      <label>Bezahlt von<select name="paidBy"></select></label>
      <fieldset>
        <legend>Aufteilen auf</legend>
        <div class="seg" role="group" aria-label="Art der Aufteilung">
          <button type="button" data-mode="equal">Gleichmäßig</button>
          <button type="button" data-mode="exact">Eigene Beträge</button>
        </div>
        <div id="splitRows"></div>
        <p id="splitHint" class="hint"></p>
      </fieldset>
      <label class="check"><input type="checkbox" id="unlock"> Andere dürfen diese Ausgabe bearbeiten</label>
    </fieldset>
    <p id="ownerInfo" class="hint"></p>
    <p id="formErr" class="err" role="alert"></p>
    <div class="actions">
      <button type="button" id="del" class="danger">Löschen</button>
      <button type="button" id="cancel" class="ghost">Abbrechen</button>
      <button type="submit" id="save" class="primary">Speichern</button>
    </div>
  </form>
</dialog>
<dialog id="planSheet" aria-labelledby="planTitle">
  <form id="planForm" novalidate>
    <h2 id="planTitle">Neuer Programmpunkt</h2>
    <fieldset id="planFields">
      <div class="types" id="planTypes" role="group" aria-label="Art">
        <button type="button" data-type="flight">✈️ Flug</button>
        <button type="button" data-type="hotel">🏨 Unterkunft</button>
        <button type="button" data-type="car">🚗 Mietwagen</button>
        <button type="button" data-type="train">🚆 Zug & Bus</button>
        <button type="button" data-type="activity">🎟️ Ausflug</button>
        <button type="button" data-type="other">📌 Sonstiges</button>
      </div>
      <label>Titel<input name="title" maxlength="80" autocomplete="off"></label>
      <div class="two">
        <label>Datum<input type="date" name="date"></label>
        <label>Uhrzeit<input type="time" name="time"></label>
      </div>
      <div class="two">
        <label>Bis Datum <span class="opt">(optional)</span><input type="date" name="endDate"></label>
        <label>Bis Uhrzeit <span class="opt">(optional)</span><input type="time" name="endTime"></label>
      </div>
      <label>Ort oder Adresse<input name="place" maxlength="140" placeholder="z. B. Flughafen Bari" autocomplete="off"></label>
      <label>Notiz<textarea name="note" rows="3" maxlength="500" placeholder="z. B. Buchungsnummer, Gate, Treffpunkt"></textarea></label>
      <div class="pdocs">
        <span class="flabel">Dokumente anhängen</span>
        <div id="planDocs"></div>
        <label class="ghost sm upbtn">+ Neues Dokument hochladen<input type="file" id="planUpload" accept="image/*,application/pdf,*/*" hidden></label>
      </div>
    </fieldset>
    <p id="planErr" class="err" role="alert"></p>
    <div class="actions">
      <button type="button" id="planDel" class="danger">Löschen</button>
      <button type="button" id="planCancel" class="ghost">Abbrechen</button>
      <button type="submit" id="planSave" class="primary">Speichern</button>
    </div>
  </form>
</dialog>
<dialog id="viewer" class="viewer" aria-labelledby="vName">
  <div class="vhead">
    <strong id="vName"></strong>
    <div class="vbtns">
      <button type="button" id="vShare" class="ghost sm">Teilen</button>
      <button type="button" id="vDel" class="ghost sm dangerline">Löschen</button>
      <button type="button" id="vClose" class="primary sm">Schließen</button>
    </div>
  </div>
  <div id="vBody" class="vbody"></div>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script>
// Startbild kurz zeigen, dann ausblenden
setTimeout(function () {
  var s = document.getElementById("splash");

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ============================================================

const firebaseConfig = {

const configured = !firebaseConfig.apiKey.startsWith("HIER");

if (configured && fbLoaded) {

const LOGO = `<svg class="logo" viewBox="0 0 200 200" aria-hidden="true">

      </svg>`;

/* ---------- Helfer ---------- */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const fmt = c => (c / 100).toLocaleString("de-DE", { style: "currency", currency: "EUR" });
const toCents = v => {
  const s = String(v).trim().replace(/\s|€/g, "").replace(/\.(?=\d{3}(\D|$))/g, "").replace(",", ".");
  if (s === "") return 0;
  const n = Number(s);
  return isFinite(n) ? Math.round(n * 100) : NaN;
};
const centsToInput = c => (c / 100).toFixed(2).replace(".", ",");
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const fmtDate = d => d ? new Date(d + "T00:00").toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" }) : "";
const fmtDay = t => t ? new Date(t).toLocaleDateString("de-DE", { day: "numeric", month: "long", year: "numeric" }) : "";
const fmtTime = t => t ? new Date(t).toLocaleString("de-DE", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
const randomId = () => { const a = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789"; return Array.from(crypto.getRandomValues(new Uint8Array(20)), b => a[b % a.length]).join(""); };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
}
function showError(err) {
  console.error(err);
  toast(err && err.code === "permission-denied"
    ? "Zugriff verweigert. Prüfe die Firestore-Regeln."
    : "Verbindung fehlgeschlagen. Prüfe dein Internet.");
}
async function shareText(text, title) {
  if (navigator.share) { try { await navigator.share({ title, text }); } catch {} return; }
  try { await navigator.clipboard.writeText(text); toast("In die Zwischenablage kopiert"); }
  catch { prompt("Text zum Kopieren:", text); }
}

/* ---------- Zustand ---------- */
const state = { gid: null, group: null, expenses: [], log: [], plan: [], docs: [], tab: "ausgaben", unsub: [] };
const groupRef = () => db.collection("groups").doc(state.gid);
const expRef = () => groupRef().collection("expenses");
const logRef = () => groupRef().collection("log");
const meKey = () => "me:" + state.gid;
const myName = () => { const m = store.get(meKey(), ""); return state.group && state.group.members.includes(m) ? m : ""; };
const status = () => (state.group && state.group.status) || "open";
const isOpen = () => status() === "open";
const ownerOf = e => e.createdBy || e.paidBy;
const isOwner = e => !!myName() && ownerOf(e) === myName();
const canEdit = e => isOpen() && !!myName() && (!!e.unlocked || isOwner(e));
const active = () => state.expenses.filter(e => !e.deleted);
const totalSpent = () => active().filter(e => e.kind !== "payment").reduce((s, e) => s + e.amount, 0);

// Jede Änderung: Daten + Gruppen-Info ("zuletzt") + Verlaufseintrag in einem Schritt
function commit(ops, text, groupExtra = {}) {
  const by = myName();
  const now = Date.now();
  const b = db.batch();
  ops(b);
  b.update(groupRef(), { ...groupExtra, updatedAt: now, lastEvent: (by ? by + " " : "") + text, lastBy: by });
  b.set(logRef().doc(), { at: now, by, text });
  return b.commit().catch(showError);
}

/* ---------- Routing ---------- */
function route() {
  state.unsub.forEach(u => u()); state.unsub = [];
  if (!configured) return renderSetup();
  if (!fbLoaded) {
    $("#app").innerHTML = `<div class="empty"><p>Keine Verbindung zum Server. Prüfe dein Internet und öffne die App erneut.</p></div>`;
    return;
  }
  const m = location.hash.match(/g=([A-Za-z0-9]+)/);
  if (m) openGroup(m[1]); else renderHome();
}
window.addEventListener("hashchange", route);

function renderSetup() {
  $("#app").innerHTML = `<div class="empty"><h1>Fast fertig</h1>
    <p>Die App ist noch nicht mit Firebase verbunden. Öffne die Datei <strong>index.html</strong> und trage oben im Skript deine Firebase-Konfiguration ein.</p></div>`;
}

/* ---------- Startseite ---------- */
function renderHome() {
  document.title = "Fifty-Fifty";
  $("#app").innerHTML = `
    <header class="home-head">
      ${LOGO}
      <h1>Fifty-Fifty</h1>
      <p>Gemeinsame Ausgaben eintragen. Die App rechnet aus, wer wem wie viel schuldet.</p>
    </header>
    <div id="homeGroups"></div>
    <section class="block">
      <h2>Gruppe beitreten</h2>
      <form id="joinGroup" class="inline">
        <input name="link" placeholder="Gruppen-Link einfügen" aria-label="Gruppen-Link" autocomplete="off">
        <button class="primary" type="submit">Beitreten</button>
      </form>
      <p class="err" id="jgErr" role="alert"></p>
    </section>
    <section class="block">
      <h2>Neue Gruppe</h2>
      <form id="newGroup">
        <label>Name der Gruppe<input name="name" required maxlength="60" placeholder="z. B. Urlaub Kroatien"></label>
        <label>Wer ist dabei?<textarea name="members" rows="4" required placeholder="Ein Name pro Zeile"></textarea></label>
        <p class="err" id="ngErr" role="alert"></p>
        <button class="primary" type="submit">Gruppe erstellen</button>
      </form>
    </section>`;
  drawGroups();
  refreshGroups();

  $("#joinGroup").onsubmit = e => {
    e.preventDefault();
    const v = e.target.link.value.trim();
    const m = v.match(/g=([A-Za-z0-9]+)/) || v.match(/^([A-Za-z0-9]{20})$/);
    if (!m) return $("#jgErr").textContent = "Füge den kompletten Link ein, den du bekommen hast.";
    location.hash = "g=" + m[1];
  };
  $("#newGroup").onsubmit = async e => {
    e.preventDefault();
    const f = e.target;
    const name = f.name.value.trim();
    const members = [...new Set(f.members.value.split(/[\n,]/).map(s => s.trim()).filter(Boolean))];
    if (!name) return $("#ngErr").textContent = "Gib der Gruppe einen Namen.";
    if (members.length < 2) return $("#ngErr").textContent = "Trag mindestens zwei Personen ein.";
    const btn = f.querySelector("button"); btn.disabled = true;
    const id = randomId(), now = Date.now();
    try {
      const ref = db.collection("groups").doc(id);
      await ref.set({ name, members, status: "open", createdAt: now, updatedAt: now, lastEvent: "Gruppe erstellt", lastBy: "" });
      ref.collection("log").add({ at: now, by: "", text: `Gruppe „${name}“ erstellt mit ${members.join(", ")}` }).catch(() => {});
      location.hash = "g=" + id;
    } catch (err) { showError(err); btn.disabled = false; }
  };
}

function drawGroups() {
  const box = $("#homeGroups"); if (!box) return;
  const recent = store.get("recent", []), seen = store.get("seen", {});
  const st = g => g.status || "open";
  const item = g => {
    const isNew = g.updatedAt && g.updatedAt > (seen[g.id] || 0) && g.lastBy !== store.get("me:" + g.id, "");
    return `<li><a href="#g=${g.id}"><span class="gname">${esc(g.name)}${isNew ? `<span class="dot" title="Neu"></span><span class="sr-only">(neu)</span>` : ""}</span>${g.lastEvent ? `<small>${esc(g.lastEvent)}</small>` : ""}</a></li>`;
  };
  const open = recent.filter(g => st(g) === "open"), closed = recent.filter(g => st(g) === "closed"), arch = recent.filter(g => st(g) === "archived");
  box.innerHTML =
    (open.length ? `<section class="block"><h2>Deine Gruppen</h2><ul class="groups">${open.map(item).join("")}</ul></section>` : "") +
    (closed.length ? `<section class="block"><h2>Abgerechnet</h2><ul class="groups">${closed.map(item).join("")}</ul></section>` : "") +
    (arch.length ? `<details class="block archive"><summary>Archiv (${arch.length})</summary><p class="sub">Gelöschte Gruppen. Du kannst sie ansehen und wiederherstellen.</p><ul class="groups">${arch.map(item).join("")}</ul></details>` : "");
}

async function refreshGroups() {
  const recent = store.get("recent", []);
  if (!recent.length) return;
  const fresh = await Promise.all(recent.map(g =>
    db.collection("groups").doc(g.id).get()
      .then(s => s.exists ? { ...g, ...pick(s.data()) } : null)
      .catch(() => g)));
  store.set("recent", fresh.filter(Boolean));
  if (!location.hash.match(/g=/)) drawGroups();
}
const pick = d => ({ name: d.name, status: d.status || "open", updatedAt: d.updatedAt || 0, lastEvent: d.lastEvent || "", lastBy: d.lastBy || "" });

function remember(id, data) {
  const list = store.get("recent", []).filter(g => g.id !== id);
  list.unshift({ id, ...pick(data) });
  store.set("recent", list.slice(0, 40));
}

/* ---------- Gruppe ---------- */
function openGroup(id) {
  state.gid = id; state.group = null; state.expenses = []; state.log = []; state.plan = []; state.docs = [];
  $("#app").innerHTML = `<p class="loading">Lade Gruppe …</p>`;
  state.unsub.push(groupRef().onSnapshot(snap => {
    if (!snap.exists) {
      $("#app").innerHTML = `<div class="empty"><p>Diese Gruppe wurde nicht gefunden. Prüfe, ob der Link vollständig ist.</p><a class="primary" href="#">Zur Startseite</a></div>`;
      return;
    }
    state.group = snap.data();
    remember(id, state.group);
    renderGroup();
  }, showError));
  state.unsub.push(expRef().orderBy("createdAt", "desc").onSnapshot(qs => {
    state.expenses = qs.docs.map(d => ({ id: d.id, ...d.data() }));
    if (state.group) renderGroup();
  }, showError));
  state.unsub.push(logRef().orderBy("at", "desc").limit(200).onSnapshot(qs => {
    state.log = qs.docs.map(d => d.data());
    if (state.group && state.tab === "verlauf") renderGroup();
  }, () => {}));
  const travelTabs = ["plan", "docs", "verlauf"];
  state.unsub.push(planRef().onSnapshot(qs => {
    state.plan = qs.docs.map(d => ({ id: d.id, ...d.data() }));
    if (state.group && travelTabs.includes(state.tab)) renderGroup();
  }, () => {}));
  state.unsub.push(docsRef().onSnapshot(qs => {
    state.docs = qs.docs.map(d => ({ id: d.id, ...d.data() }));
    if (state.group && travelTabs.includes(state.tab)) renderGroup();
  }, () => {}));
}

function stats() {
  const s = {};
  const get = m => s[m] || (s[m] = { paid: 0, share: 0, sent: 0, recv: 0 });
  state.group.members.forEach(get);
  for (const e of active()) {
    if (e.kind === "payment") { get(e.paidBy).sent += e.amount; e.shares.forEach(x => get(x.m).recv += x.c); }
    else { get(e.paidBy).paid += e.amount; e.shares.forEach(x => get(x.m).share += x.c); }
  }
  for (const m in s) s[m].bal = s[m].paid - s[m].share + s[m].sent - s[m].recv;
  return s;
}

// Schulden vereinfachen: möglichst wenige Überweisungen
function settle(st) {
  const cred = [], debt = [];
  for (const [m, x] of Object.entries(st)) { if (x.bal > 0) cred.push({ m, v: x.bal }); else if (x.bal < 0) debt.push({ m, v: -x.bal }); }
  cred.sort((a, b) => b.v - a.v); debt.sort((a, b) => b.v - a.v);
  const out = []; let i = 0, j = 0;
  while (i < debt.length && j < cred.length) {
    const x = Math.min(debt[i].v, cred[j].v);
    out.push({ from: debt[i].m, to: cred[j].m, amount: x });
    debt[i].v -= x; cred[j].v -= x;
    if (!debt[i].v) i++;
    if (!cred[j].v) j++;
  }
  return out;
}

function renderGroup() {
  const g = state.group, me = myName(), st = stats(), total = totalSpent(), n = g.members.length;
  document.title = g.name + " – Fifty-Fifty";
  const seen = store.get("seen", {}); seen[state.gid] = Date.now(); store.set("seen", seen);

  const banner = status() === "closed"
    ? `<div class="banner ok">✓ Abgerechnet am ${fmtDay(g.closedAt)}. Die Gruppe ist schreibgeschützt.</div>`
    : status() === "archived"
      ? `<div class="banner warn">Diese Gruppe wurde am ${fmtDay(g.archivedAt)} gelöscht und liegt im Archiv. Du kannst sie dir ansehen oder wiederherstellen.</div>`
      : "";

  let tiles;
  if (me) {
    const b = st[me].bal;
    tiles = tile("Gesamt", fmt(total)) + tile("Dein Anteil", fmt(st[me].share)) +
      tile(b > 0 ? "Du bekommst" : b < 0 ? "Du schuldest" : "Offen", b ? fmt(Math.abs(b)) : "✓ 0,00 €", b > 0 ? "plus" : b < 0 ? "minus" : "");
  } else {
    tiles = tile("Gesamt", fmt(total)) + tile("Ø pro Person", fmt(Math.round(total / n))) + tile("Personen", String(n));
  }

  const who = me
    ? `<p class="sub">Du bist <strong>${esc(me)}</strong> · <button class="linkbtn" id="changeMe" type="button">ändern</button> · <button class="linkbtn" id="share" type="button">Link teilen</button></p>`
    : `<div class="who"><p><strong>Wer bist du?</strong> Damit siehst du deinen Anteil, und nur du kannst deine eigenen Einträge ändern.</p>
        <div class="chips">${g.members.map(m => `<button class="chip" type="button" data-me="${esc(m)}">${esc(m)}</button>`).join("")}</div>
        <p class="sub"><button class="linkbtn" id="share" type="button">Link teilen</button></p></div>`;

  const tabs = [["ausgaben", "Ausgaben"], ["uebersicht", "Übersicht"], ["plan", "Reiseplan"], ["docs", "Dokumente"], ["verlauf", "Verlauf"]];
  $("#app").innerHTML = `
    <header>
      <a href="#" class="back">‹ Alle Gruppen</a>
      <h1>${esc(g.name)}</h1>
      ${banner}
      <div class="stats">${tiles}</div>
      ${who}
    </header>
    <nav class="tabs" role="tablist">
      ${tabs.map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="${state.tab === k}">${l}</button>`).join("")}
    </nav>
    <main>${({ ausgaben: renderExpenses, uebersicht: () => renderOverview(st), plan: renderPlan, docs: renderDocs, verlauf: renderLog }[state.tab] || renderExpenses)()}</main>
    ${isOpen() && ["ausgaben", "uebersicht"].includes(state.tab) ? `<button class="fab primary" id="add" type="button">Ausgabe hinzufügen</button>` : ""}`;
  bindGroup(st);
  bindTravel();
  const at = $(".tabs [aria-selected=true]"); if (at) at.scrollIntoView({ block: "nearest", inline: "center" });
}
const tile = (label, value, cls = "") => `<div class="stat"><small>${label}</small><b class="${cls}">${value}</b></div>`;

function needMe() {
  if (myName()) return false;
  toast("Wähle zuerst oben aus, wer du bist.");
  window.scrollTo({ top: 0, behavior: "smooth" });
  return true;
}

function bindGroup(st) {
  const g = state.group;
  $$("[data-me]").forEach(b => b.onclick = () => { store.set(meKey(), b.dataset.me); renderGroup(); });
  const cm = $("#changeMe");
  if (cm) cm.onclick = () => {
    if (confirm("Möchtest du wechseln, wer du bist? Danach kannst du nur noch die Einträge der neu gewählten Person ändern.")) { store.set(meKey(), ""); renderGroup(); }
  };
  $("#share").onclick = () => shareText(`Trag deine Ausgaben für „${g.name}“ hier ein:\n${location.href}`, g.name);
  const add = $("#add"); if (add) add.onclick = () => { if (!needMe()) openSheet(); };
  $$(".tabs button").forEach(t => t.onclick = () => { state.tab = t.dataset.tab; renderGroup(); });

  $$(".item").forEach(el => el.onclick = () => {
    const e = state.expenses.find(x => x.id === el.dataset.id);
    if (!e) return;
    if (e.kind !== "payment") return openSheet(e);
    if (!canEdit(e)) return toast(isOpen() ? `Nur ${ownerOf(e)} kann diese Rückzahlung löschen.` : "Die Gruppe ist abgeschlossen.");
    if (confirm(`Rückzahlung von ${e.paidBy} an ${e.shares[0].m} (${fmt(e.amount)}) löschen?`))
      commit(b => b.update(expRef().doc(e.id), { deleted: true, deletedAt: Date.now(), deletedBy: myName() }),
        `hat die Rückzahlung ${e.paidBy} → ${e.shares[0].m} (${fmt(e.amount)}) gelöscht`);
  });

  $$("[data-settle]").forEach(btn => btn.onclick = () => {
    if (needMe()) return;
    const s = settle(st)[+btn.dataset.settle];
    if (!s || !confirm(`Hat ${s.from} ${fmt(s.amount)} an ${s.to} überwiesen?`)) return;
    const ref = expRef().doc();
    commit(b => b.set(ref, {
      kind: "payment", desc: "Rückzahlung", amount: s.amount, date: today(), paidBy: s.from,
      shares: [{ m: s.to, c: s.amount }], createdAt: Date.now(), createdBy: myName(), unlocked: false, deleted: false
    }), `hat ${s.from} → ${s.to} (${fmt(s.amount)}) als bezahlt markiert`).then(() => toast("Als bezahlt markiert"));
  });

  $$("[data-restore]").forEach(btn => btn.onclick = () => {
    const e = state.expenses.find(x => x.id === btn.dataset.restore);
    if (!e) return;
    commit(b => b.update(expRef().doc(e.id), { deleted: false }),
      `hat ${e.kind === "payment" ? `die Rückzahlung ${e.paidBy} → ${e.shares[0].m}` : `„${e.desc}“`} (${fmt(e.amount)}) wiederhergestellt`)
      .then(() => toast("Wiederhergestellt"));
  });

  $$("[data-restore-plan]").forEach(btn => btn.onclick = () => {
    const p = state.plan.find(x => x.id === btn.dataset.restorePlan); if (!p) return;
    commit(b => b.update(planRef().doc(p.id), { deleted: false }), `hat „${p.title}“ im Reiseplan wiederhergestellt`).then(() => toast("Wiederhergestellt"));
  });
  $$("[data-restore-doc]").forEach(btn => btn.onclick = () => {
    const d = state.docs.find(x => x.id === btn.dataset.restoreDoc); if (!d) return;
    commit(b => b.update(docsRef().doc(d.id), { deleted: false }), `hat das Dokument „${d.name}“ wiederhergestellt`).then(() => toast("Wiederhergestellt"));
  });

  const am = $("#addMember");
  if (am) am.onsubmit = e => {
    e.preventDefault();
    if (needMe()) return;
    const name = e.target.name.value.trim();
    if (!name) return;
    if (g.members.includes(name)) return toast(`${name} ist schon in der Gruppe`);
    commit(() => {}, `hat ${name} zur Gruppe hinzugefügt`, { members: firebase.firestore.FieldValue.arrayUnion(name) })
      .then(() => toast(`${name} hinzugefügt`));
  };

  const act = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  act("#summary", () => shareText(summaryText(st), g.name));
  act("#closeGroup", () => {
    if (needMe()) return;
    if (!confirm("Abrechnung abschließen? Danach kann niemand mehr Ausgaben eintragen oder ändern. Du kannst die Gruppe später wieder öffnen.")) return;
    commit(() => {}, "hat die Abrechnung abgeschlossen", { status: "closed", closedAt: Date.now() })
      .then(() => toast("Abrechnung abgeschlossen. Teile jetzt die Zusammenfassung mit allen."));
  });
  act("#reopenGroup", () => {
    if (needMe()) return;
    if (confirm("Gruppe wieder öffnen? Dann können wieder Ausgaben eingetragen werden."))
      commit(() => {}, "hat die Gruppe wieder geöffnet", { status: "open" });
  });
  act("#archiveGroup", () => {
    if (needMe()) return;
    if (confirm(`Gruppe „${g.name}“ löschen? Sie verschwindet aus der Liste und wandert ins Archiv. Dort kann sie jeder aus der Gruppe ansehen und wiederherstellen.`))
      commit(() => {}, "hat die Gruppe gelöscht (Archiv)", { status: "archived", archivedAt: Date.now() })
        .then(() => { toast("Gruppe ins Archiv verschoben"); location.hash = ""; });
  });
  act("#restoreGroup", () => {
    if (needMe()) return;
    commit(() => {}, "hat die Gruppe aus dem Archiv wiederhergestellt", { status: "closed" })
      .then(() => toast("Gruppe wiederhergestellt"));
  });
}

function renderExpenses() {
  const list = active();
  if (!list.length)
    return `<div class="empty"><p>${isOpen() ? "Noch keine Ausgaben. Trag die erste ein, zum Beispiel den Einkauf oder die Tankfüllung." : "Keine Ausgaben."}</p></div>`;
  const all = state.group.members.length;
  const sorted = [...list].sort((a, b) => (b.date || "").localeCompare(a.date || "") || b.createdAt - a.createdAt);
  let html = `<ul class="list">`, last = null;
  for (const e of sorted) {
    if (e.date !== last) { html += `<li class="day">${fmtDate(e.date)}</li>`; last = e.date; }
    const lock = isOpen() && myName() && !canEdit(e) ? `<span class="lock" title="Nur ${esc(ownerOf(e))} kann das ändern">🔒</span>` : "";
    if (e.kind === "payment") {
      html += `<li><button class="item pay" data-id="${e.id}"><span class="txt"><strong>${esc(e.paidBy)} hat ${esc(e.shares[0].m)} Geld zurückgezahlt${lock}</strong></span><span class="amt">${fmt(e.amount)}</span></button></li>`;
    } else {
      const who = e.shares.length === all ? "alle" : e.shares.map(s => s.m).join(", ");
      html += `<li><button class="item" data-id="${e.id}"><span class="txt"><strong>${esc(e.desc)}${lock}</strong><small>${esc(e.paidBy)} hat bezahlt, für ${esc(who)}</small></span><span class="amt">${fmt(e.amount)}</span></button></li>`;
    }
  }
  return html + `</ul>`;
}

function renderOverview(st) {
  const g = state.group, me = myName(), total = totalSpent(), n = g.members.length;
  const plan = settle(st);
  const rows = g.members.map(m => {
    const x = st[m];
    const cls = x.bal > 0 ? "plus" : x.bal < 0 ? "minus" : "";
    const bal = x.bal > 0 ? `+${fmt(x.bal)}` : x.bal < 0 ? `−${fmt(-x.bal)}` : "✓";
    return `<div class="prow">
      <div class="pname">${esc(m)}${m === me ? `<span class="badge">du</span>` : ""}</div>
      <div class="pnums"><span>Anteil <b>${fmt(x.share)}</b></span><span>bezahlt <b>${fmt(x.paid)}</b></span></div>
      <div class="pbal ${cls}" title="${x.bal > 0 ? "bekommt noch" : x.bal < 0 ? "schuldet noch" : "ausgeglichen"}">${bal}</div>
    </div>`;
  }).join("");

  let settleBlock;
  if (isOpen()) {
    settleBlock = plan.length
      ? `<h2>So wird ausgeglichen</h2><ul class="settle">${plan.map((s, i) => `<li>
          <span class="txt"><strong>${esc(s.from)}</strong> zahlt <strong>${esc(s.to)}</strong> <span class="num">${fmt(s.amount)}</span></span>
          <button class="ghost sm" type="button" data-settle="${i}">Erledigt</button></li>`).join("")}</ul>
         <div class="btnrow"><button class="ghost sm" id="summary" type="button">Zwischenstand teilen</button></div>`
      : `<h2>Alles ausgeglichen</h2><p class="sub">Es ist nichts mehr offen. Schließt die Abrechnung ab, dann bleibt die Endabrechnung so stehen und die Gruppe ist schreibgeschützt.</p>
         <div class="btnrow"><button class="primary" id="closeGroup" type="button">Abrechnung abschließen</button><button class="ghost sm" id="summary" type="button">Zusammenfassung teilen</button></div>`;
  } else {
    const pays = active().filter(e => e.kind === "payment");
    settleBlock = `<h2>Endabrechnung</h2>
      ${pays.length ? `<ul class="settle">${pays.map(p => `<li><span class="txt">${esc(p.paidBy)} → ${esc(p.shares[0].m)} <span class="num">${fmt(p.amount)}</span></span><span class="plus">✓ bezahlt</span></li>`).join("")}</ul>` : `<p class="sub">Es waren keine Rückzahlungen nötig.</p>`}
      <div class="btnrow">
        <button class="primary" id="summary" type="button">Zusammenfassung teilen</button>
        ${status() === "closed"
          ? `<button class="ghost sm" id="reopenGroup" type="button">Wieder öffnen</button><button class="ghost sm dangerline" id="archiveGroup" type="button">Gruppe löschen</button>`
          : `<button class="ghost sm" id="restoreGroup" type="button">Wiederherstellen</button>`}
      </div>`;
  }

  return `
    <section class="block">
      <h2>Wer hat was?</h2>
      <p class="sub">Gesamt ${fmt(total)} · ${n} Personen · Ø ${fmt(Math.round(total / n))}. Der Anteil berücksichtigt, wer bei welcher Ausgabe dabei war.</p>
      ${rows}
    </section>
    <section class="block">${settleBlock}</section>
    ${isOpen() ? `<section class="block">
      <h2>Person hinzufügen</h2>
      <form id="addMember" class="inline"><input name="name" maxlength="40" placeholder="Name" aria-label="Name"><button class="primary" type="submit">Hinzufügen</button></form>
    </section>` : ""}`;
}

function renderLog() {
  const delPlan = state.plan.filter(p => p.deleted), delDocs = state.docs.filter(d => d.deleted);
  const canR = isOpen() && !!myName();
  const travelDel = delPlan.length || delDocs.length ? `<section class="block"><h2>Gelöscht aus Reiseplan & Dokumenten</h2><ul class="loglist">
    ${delPlan.map(p => `<li><div><b>${(PLAN_TYPES[p.type] || PLAN_TYPES.other).icon} ${esc(p.title)}</b><small>gelöscht${p.deletedBy ? ` von ${esc(p.deletedBy)}` : ""} ${fmtTime(p.deletedAt)}</small></div>${canR ? `<button class="ghost sm" type="button" data-restore-plan="${p.id}">Zurückholen</button>` : ""}</li>`).join("")}
    ${delDocs.map(d => `<li><div><b>${docIcon(d)} ${esc(d.name)}</b><small>gelöscht${d.deletedBy ? ` von ${esc(d.deletedBy)}` : ""} ${fmtTime(d.deletedAt)}</small></div>${canR ? `<button class="ghost sm" type="button" data-restore-doc="${d.id}">Zurückholen</button>` : ""}</li>`).join("")}
  </ul></section>` : "";
  const del = state.expenses.filter(e => e.deleted);
  const canRestore = e => isOpen() && !!myName() && (!!e.unlocked || isOwner(e) || e.deletedBy === myName());
  const label = e => e.kind === "payment" ? `Rückzahlung ${esc(e.paidBy)} → ${esc(e.shares[0].m)}` : esc(e.desc);
  return travelDel + (del.length ? `<section class="block"><h2>Gelöschte Ausgaben</h2><ul class="loglist">${del.map(e => `<li>
      <div><b>${label(e)}</b> · ${fmt(e.amount)}<small>gelöscht${e.deletedBy ? ` von ${esc(e.deletedBy)}` : ""} ${fmtTime(e.deletedAt)}</small></div>
      ${canRestore(e) ? `<button class="ghost sm" type="button" data-restore="${e.id}">Zurückholen</button>` : ""}</li>`).join("")}</ul></section>` : "") +
    `<section class="block"><h2>Verlauf</h2>${state.log.length
      ? `<ul class="loglist">${state.log.map(l => `<li><div>${l.by ? `<b>${esc(l.by)}</b> ` : ""}${esc(l.text)}<small>${fmtTime(l.at)}</small></div></li>`).join("")}</ul>`
      : `<p class="sub">Noch keine Einträge. Ab jetzt wird hier jede Änderung festgehalten.</p>`}</section>`;
}

function summaryText(st) {
  const g = state.group, total = totalSpent(), plan = settle(st);
  const L = [`Fifty-Fifty · ${g.name} – ${isOpen() ? "Zwischenstand" : "Endabrechnung"}`, `Gesamtausgaben: ${fmt(total)} (${g.members.length} Personen)`, ""];
  g.members.forEach(m => L.push(`${m}: Anteil ${fmt(st[m].share)}, bezahlt ${fmt(st[m].paid)}`));
  L.push("");
  if (plan.length) { L.push("Noch offen:"); plan.forEach(s => L.push(`• ${s.from} → ${s.to}: ${fmt(s.amount)}`)); }
  else L.push("✓ Alles ausgeglichen.");
  L.push("", location.href);
  return L.join("\n");
}

/* ---------- Ausgabe anlegen / bearbeiten ---------- */
const dlg = $("#sheet"), F = $("#expForm");
let sheet = null;

function openSheet(e) {
  const g = state.group, me = myName();
  const editable = e ? canEdit(e) : isOpen();
  const owner = e ? isOwner(e) : true;
  sheet = {
    prev: e || null, editable,
    mode: e && e.splitMode === "exact" ? "exact" : "equal",
    sel: new Set(e ? e.shares.map(s => s.m) : g.members), exact: {}
  };
  if (e && e.splitMode === "exact") e.shares.forEach(s => sheet.exact[s.m] = centsToInput(s.c));
  F.desc.value = e ? e.desc : "";
  F.amount.value = e ? centsToInput(e.amount) : "";
  F.date.value = e ? e.date : today();
  const payer = e ? e.paidBy : (g.members.includes(me) ? me : g.members[0]);
  F.paidBy.innerHTML = g.members.map(m => `<option value="${esc(m)}" ${m === payer ? "selected" : ""}>${esc(m)}</option>`).join("");
  $("#unlock").checked = !!(e && e.unlocked);
  $("#unlock").disabled = !owner;
  $("#formFields").disabled = !editable;
  $("#sheetTitle").textContent = !e ? "Neue Ausgabe" : editable ? "Ausgabe bearbeiten" : "Ausgabe";
  $("#ownerInfo").textContent = !e ? "Nur du kannst diese Ausgabe später ändern, außer du gibst sie frei."
    : !isOpen() ? "Die Gruppe ist abgeschlossen. Einträge können nicht mehr geändert werden."
    : owner ? `Von dir eingetragen${e.updatedBy ? `, zuletzt geändert von ${e.updatedBy}` : ""}.`
    : e.unlocked ? `Eingetragen von ${ownerOf(e)}, für alle freigegeben.`
    : `Eingetragen von ${ownerOf(e)}. Nur ${ownerOf(e)} kann diese Ausgabe ändern oder löschen.`;
  $("#del").hidden = !e || !editable;
  $("#save").hidden = !editable;
  $("#cancel").textContent = editable ? "Abbrechen" : "Schließen";
  $("#formErr").textContent = "";
  $("#save").disabled = false;
  setMode(sheet.mode);
  dlg.showModal();
  if (!e) setTimeout(() => F.desc.focus(), 50);
}

function setMode(mode) {
  sheet.mode = mode;
  $$(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === mode));
  renderSplit();
}

function renderSplit() {
  const members = state.group.members;
  const amount = toCents(F.amount.value) || 0;
  if (sheet.mode === "equal") {
    const n = members.filter(m => sheet.sel.has(m)).length;
    $("#splitRows").innerHTML = members.map(m => `<label class="srow">
      <input type="checkbox" data-m="${esc(m)}" ${sheet.sel.has(m) ? "checked" : ""}>
      <span>${esc(m)}</span>
      <span class="amt">${sheet.sel.has(m) && amount > 0 && n ? fmt(Math.round(amount / n)) : ""}</span></label>`).join("");
  } else {
    $("#splitRows").innerHTML = members.map(m => `<label class="srow">
      <span>${esc(m)}</span>
      <input inputmode="decimal" data-m="${esc(m)}" value="${esc(sheet.exact[m] || "")}" placeholder="0,00" autocomplete="off"></label>`).join("");
  }
  updateHint();
}

function updateHint() {
  const amount = toCents(F.amount.value) || 0;
  const h = $("#splitHint");
  if (sheet.mode === "equal") {
    const n = state.group.members.filter(m => sheet.sel.has(m)).length;
    h.textContent = n ? `Wird auf ${n} ${n === 1 ? "Person" : "Personen"} aufgeteilt.` : "Wähle mindestens eine Person aus.";
  } else {
    const sum = state.group.members.reduce((s, m) => s + (toCents(sheet.exact[m] || "") || 0), 0);
    const diff = amount - sum;
    h.textContent = diff === 0 ? `Passt genau: ${fmt(sum)} verteilt.`
      : diff > 0 ? `Noch ${fmt(diff)} zu verteilen.` : `${fmt(-diff)} zu viel verteilt.`;
  }
}

$$(".seg button").forEach(b => b.onclick = () => setMode(b.dataset.mode));
F.amount.addEventListener("input", () => sheet.mode === "equal" ? renderSplit() : updateHint());
$("#splitRows").addEventListener("input", e => {
  const m = e.target.dataset.m;
  if (m == null) return;
  if (e.target.type === "checkbox") { e.target.checked ? sheet.sel.add(m) : sheet.sel.delete(m); renderSplit(); }
  else { sheet.exact[m] = e.target.value; updateHint(); }
});
$("#cancel").onclick = () => dlg.close();
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
$("#del").onclick = () => {
  const e = sheet.prev;
  if (!e || !canEdit(e) || !confirm(`„${e.desc}“ löschen? Der Eintrag bleibt im Verlauf sichtbar und kann zurückgeholt werden.`)) return;
  commit(b => b.update(expRef().doc(e.id), { deleted: true, deletedAt: Date.now(), deletedBy: myName() }),
    `hat „${e.desc}“ (${fmt(e.amount)}) gelöscht`).then(() => toast("Ausgabe gelöscht"));
  dlg.close();
};

F.onsubmit = e => {
  e.preventDefault();
  if (!sheet.editable) return;
  const err = msg => { $("#formErr").textContent = msg; };
  const desc = F.desc.value.trim();
  const amount = toCents(F.amount.value);
  const members = state.group.members;
  if (!desc) return err("Wofür war die Ausgabe?");
  if (!(amount > 0)) return err("Gib einen gültigen Betrag ein, z. B. 12,50.");
  if (!F.date.value) return err("Wähle ein Datum.");

  let shares;
  if (sheet.mode === "equal") {
    const sel = members.filter(m => sheet.sel.has(m));
    if (!sel.length) return err("Wähle mindestens eine Person aus.");
    const base = Math.floor(amount / sel.length), rest = amount - base * sel.length;
    shares = sel.map((m, i) => ({ m, c: base + (i < rest ? 1 : 0) }));
  } else {
    shares = members.map(m => ({ m, c: toCents(sheet.exact[m] || "") }));
    if (shares.some(s => isNaN(s.c) || s.c < 0)) return err("Mindestens ein Betrag ist ungültig.");
    shares = shares.filter(s => s.c > 0);
    const sum = shares.reduce((s, x) => s + x.c, 0);
    if (sum !== amount) return err(`Die Einzelbeträge ergeben ${fmt(sum)}, die Ausgabe ist ${fmt(amount)}.`);
  }

  const prev = sheet.prev, me = myName();
  const owner = prev ? isOwner(prev) : true;
  const unlocked = owner ? $("#unlock").checked : !!prev.unlocked;
  const data = {
    kind: "expense", desc, amount, date: F.date.value, paidBy: F.paidBy.value, shares, splitMode: sheet.mode,
    createdAt: prev ? (prev.createdAt || Date.now()) : Date.now(),
    createdBy: prev ? ownerOf(prev) : me, unlocked, deleted: false
  };
  if (prev) { data.updatedAt = Date.now(); data.updatedBy = me; }
  let text;
  if (!prev) text = `hat „${desc}“ (${fmt(amount)}) hinzugefügt`;
  else {
    const ch = [];
    if (prev.amount !== amount) ch.push(`${fmt(prev.amount)} → ${fmt(amount)}`);
    if (prev.desc !== desc) ch.push(`vorher „${prev.desc}“`);
    if (prev.paidBy !== data.paidBy) ch.push(`bezahlt von ${data.paidBy} statt ${prev.paidBy}`);
    if (!!prev.unlocked !== unlocked) ch.push(unlocked ? "für alle freigegeben" : "wieder gesperrt");
    text = `hat „${desc}“ geändert${ch.length ? ` (${ch.join(", ")})` : ""}`;
  }
  const ref = prev ? expRef().doc(prev.id) : expRef().doc();
  $("#save").disabled = true;
  commit(b => b.set(ref, data), text);
  dlg.close();
  toast(prev ? "Änderung gespeichert" : "Ausgabe gespeichert");
};

/* ---------- Reiseplan ---------- */
const planRef = () => groupRef().collection("plan");
const docsRef = () => groupRef().collection("docs");
const PLAN_TYPES = {
  flight:   { icon: "✈️", label: "Flug",        ph: "z. B. Flug München → Bari" },
  hotel:    { icon: "🏨", label: "Unterkunft",  ph: "z. B. Ferienwohnung Altstadt" },
  car:      { icon: "🚗", label: "Mietwagen",   ph: "z. B. Mietwagen Abholung" },
  train:    { icon: "🚆", label: "Zug & Bus",   ph: "z. B. Zug Bari → Lecce" },
  activity: { icon: "🎟️", label: "Ausflug",     ph: "z. B. Bootstour Polignano" },
  other:    { icon: "📌", label: "Sonstiges",   ph: "z. B. Treffpunkt" }
};
const activePlan = () => state.plan.filter(p => !p.deleted);
const activeDocs = () => state.docs.filter(d => !d.deleted);
const dayDiff = d => Math.round((Date.parse(d + "T00:00") - Date.parse(today() + "T00:00")) / 864e5);
const mapsUrl = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
const fmtShortDay = d => d ? new Date(d + "T00:00").toLocaleDateString("de-DE", { weekday: "short", day: "numeric", month: "short" }) : "";

function countdown() {
  const ds = activePlan().filter(p => p.date);
  if (!ds.length) return "";
  const start = ds.map(p => p.date).sort()[0];
  const end = ds.map(p => p.endDate || p.date).sort().slice(-1)[0];
  const toStart = dayDiff(start), toEnd = dayDiff(end);
  if (toStart > 1) return `<div class="countdown"><b>${toStart}</b><span>Tage bis zur Reise</span></div>`;
  if (toStart === 1) return `<div class="countdown"><b>Morgen</b><span>geht’s los!</span></div>`;
  if (toEnd >= 0) return `<div class="countdown"><b>Tag ${1 - toStart}</b><span>von ${toEnd - toStart + 1}</span></div>`;
  return "";
}

function renderPlan() {
  const items = activePlan().sort((a, b) => ((a.date || "9999") + (a.time || "99:99")).localeCompare((b.date || "9999") + (b.time || "99:99")));
  const docs = activeDocs();
  let html = countdown();
  if (isOpen()) html += `<button class="primary addline" id="addPlan" type="button">+ Programmpunkt</button>`;
  if (!items.length) return html + `<div class="empty"><p>Noch nichts geplant. Trag Flüge, Unterkunft oder Ausflüge ein und häng die passenden Tickets an.</p></div>`;
  html += `<ul class="list">`;
  let last = null;
  for (const p of items) {
    if ((p.date || "") !== last) {
      last = p.date || "";
      const dd = p.date ? dayDiff(p.date) : null;
      const tag = dd === 0 ? `<span class="badge">heute</span>` : dd === 1 ? `<span class="badge soft">morgen</span>` : "";
      html += `<li class="day">${p.date ? fmtDate(p.date) : "Ohne Datum"}${tag}</li>`;
    }
    const t = PLAN_TYPES[p.type] || PLAN_TYPES.other;
    const past = p.date && dayDiff(p.endDate || p.date) < 0;
    const until = p.endDate || p.endTime ? ` – ${p.endDate && p.endDate !== p.date ? fmtShortDay(p.endDate) + " " : ""}${p.endTime || ""}` : "";
    const pdocs = (p.docIds || []).map(id => docs.find(d => d.id === id)).filter(Boolean);
    html += `<li class="pitem${past ? " past" : ""}">
      <button class="pmain" type="button" data-plan="${p.id}">
        <span class="picon" aria-hidden="true">${t.icon}</span>
        <span class="ptxt"><span class="ptime">${p.time ? esc(p.time) : t.label}${esc(until)}</span><strong>${esc(p.title)}</strong>${p.note ? `<small>${esc(p.note)}</small>` : ""}</span>
      </button>
      ${p.place || pdocs.length ? `<div class="pextra">
        ${p.place ? `<a class="chipline" href="${mapsUrl(p.place)}" target="_blank" rel="noopener">📍 ${esc(p.place)}</a>` : ""}
        ${pdocs.map(d => `<button class="chipline" type="button" data-doc="${d.id}">${docIcon(d)} ${esc(d.name)}</button>`).join("")}
      </div>` : ""}
    </li>`;
  }
  return html + `</ul>`;
}

/* ---------- Dokumente ---------- */
const MAX_FILE = 5 * 1024 * 1024, CHUNK = 700000;
const blobCache = {};
const docIcon = d => d.type === "application/pdf" ? "📄" : (d.type || "").startsWith("image/") ? "🖼️" : "📎";
const fmtSize = b => b > 1048576 ? (b / 1048576).toFixed(1).replace(".", ",") + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";
const offlineKey = () => "offline:" + state.gid;

function renderDocs() {
  const docs = activeDocs().sort((a, b) => b.createdAt - a.createdAt);
  const off = store.get(offlineKey(), []);
  const plan = activePlan();
  let html = `<div class="note">🔒 Jeder mit dem Gruppen-Link kann Dokumente sehen. Lade Buchungen und Tickets hoch, aber keine Reisepässe oder Ausweise.</div>`;
  if (isOpen()) html += `<label class="primary addline upbtn">+ Dokument hinzufügen<input type="file" id="docUpload" accept="image/*,application/pdf,*/*" hidden></label>`;
  html += `<p id="upState" class="hint" role="status"></p>`;
  if (!docs.length) return html + `<div class="empty"><p>Noch keine Dokumente. Bordkarten, Hotelbestätigungen oder Tickets lassen sich als Foto oder PDF ablegen.</p></div>`;
  html += `<ul class="list">${docs.map(d => {
    const used = plan.filter(p => (p.docIds || []).includes(d.id)).map(p => p.title);
    return `<li><button class="item" type="button" data-doc="${d.id}">
      <span class="picon" aria-hidden="true">${docIcon(d)}</span>
      <span class="txt"><strong>${esc(d.name)}</strong><small>${fmtSize(d.size)} · von ${esc(d.createdBy || "?")}${used.length ? ` · zu: ${esc(used.join(", "))}` : ""}</small></span>
      ${off.includes(d.id) ? `<span class="offl" title="Offline verfügbar">✓ offline</span>` : ""}
    </button></li>`; }).join("")}</ul>
    <div class="btnrow"><button class="ghost sm" id="allOffline" type="button">Alle offline verfügbar machen</button></div>`;
  return html;
}

async function prepareFile(file) {
  if ((file.type || "").startsWith("image/") && !/gif|svg/.test(file.type)) {
    try {
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
      const c = document.createElement("canvas");
      c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.82));
      if (blob) return { blob, type: "image/jpeg", name: file.name.replace(/\.[^.]+$/, "") + ".jpg" };
    } catch {}
  }
  return { blob: file, type: file.type || "application/octet-stream", name: file.name };
}
const toB64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1] || ""); r.onerror = rej; r.readAsDataURL(blob); });

async function uploadDoc(file) {
  const p = await prepareFile(file);
  if (p.blob.size > MAX_FILE) { toast(`„${file.name}“ ist zu groß (${fmtSize(p.blob.size)}). Erlaubt sind bis 5 MB.`); return null; }
  const b64 = await toB64(p.blob);
  const n = Math.max(1, Math.ceil(b64.length / CHUNK));
  const ref = docsRef().doc();
  const writes = [];
  for (let i = 0; i < n; i++) writes.push(ref.collection("chunks").doc(String(i).padStart(3, "0")).set({ i, d: b64.slice(i * CHUNK, (i + 1) * CHUNK) }));
  blobCache[ref.id] = p.blob;
  commit(b => b.set(ref, { name: p.name, type: p.type, size: p.blob.size, chunks: n, createdAt: Date.now(), createdBy: myName(), deleted: false }),
    `hat das Dokument „${p.name}“ hochgeladen`);
  const off = store.get(offlineKey(), []); off.push(ref.id); store.set(offlineKey(), off);
  Promise.all(writes).then(() => toast(`„${p.name}“ hochgeladen`)).catch(showError);
  return ref.id;
}

async function loadDoc(d) {
  if (blobCache[d.id]) return blobCache[d.id];
  const qs = await docsRef().doc(d.id).collection("chunks").orderBy("i").get();
  if (qs.size < (d.chunks || 1)) throw new Error("incomplete");
  const bin = atob(qs.docs.map(x => x.data().d).join(""));
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  const blob = new Blob([arr], { type: d.type });
  const off = store.get(offlineKey(), []); if (!off.includes(d.id)) { off.push(d.id); store.set(offlineKey(), off); }
  return blobCache[d.id] = blob;
}

let pdfjsP = null;
function loadPdfJs() {
  return pdfjsP || (pdfjsP = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; res(window.pdfjsLib); };
    s.onerror = () => { pdfjsP = null; rej(new Error("pdfjs")); };
    document.head.appendChild(s);
  }));
}

const viewer = $("#viewer");
let viewing = null;
async function openDoc(id) {
  const d = state.docs.find(x => x.id === id);
  if (!d) return;
  viewing = d;
  $("#vName").textContent = d.name;
  $("#vDel").hidden = !(isOpen() && myName() && (d.createdBy === myName() || !d.createdBy));
  const body = $("#vBody");
  body.innerHTML = `<p class="loading">Lade Dokument …</p>`;
  viewer.showModal();
  let blob;
  try { blob = await loadDoc(d); }
  catch { body.innerHTML = `<p class="loading">Das Dokument ist auf diesem Gerät noch nicht gespeichert und es gibt gerade keine Verbindung. Versuch es mit Internet erneut.</p>`; return; }
  if (viewing !== d) return;
  if (d.type.startsWith("image/")) {
    body.innerHTML = `<img alt="${esc(d.name)}" src="${URL.createObjectURL(blob)}">`;
  } else if (d.type === "application/pdf") {
    body.innerHTML = "";
    try {
      const lib = await loadPdfJs();
      const pdf = await lib.getDocument({ data: new Uint8Array(await blob.arrayBuffer()) }).promise;
      for (let n = 1; n <= pdf.numPages && viewing === d; n++) {
        const page = await pdf.getPage(n);
        const w = body.clientWidth || 340;
        const v = page.getViewport({ scale: (w / page.getViewport({ scale: 1 }).width) * (window.devicePixelRatio || 1) });
        const c = document.createElement("canvas");
        c.width = v.width; c.height = v.height;
        body.appendChild(c);
        await page.render({ canvasContext: c.getContext("2d"), viewport: v }).promise;
      }
    } catch {
      body.innerHTML = `<p class="loading">Die Vorschau lässt sich gerade nicht anzeigen. Tippe auf „Teilen“, um das PDF in einer anderen App zu öffnen.</p>`;
    }
  } else {
    body.innerHTML = `<p class="loading">Für diesen Dateityp gibt es keine Vorschau. Tippe auf „Teilen“, um die Datei in einer anderen App zu öffnen.</p>`;
  }
}
$("#vClose").onclick = () => { viewing = null; viewer.close(); };
viewer.addEventListener("close", () => { viewing = null; });
$("#vShare").onclick = async () => {
  const d = viewing; if (!d) return;
  const blob = blobCache[d.id] || await loadDoc(d).catch(() => null);
  if (!blob) return toast("Dokument noch nicht geladen.");
  const file = new File([blob], d.name, { type: d.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: d.name }); } catch {} return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = d.name; a.click();
};
$("#vDel").onclick = () => {
  const d = viewing; if (!d) return;
  if (!confirm(`Dokument „${d.name}“ löschen? Es bleibt im Verlauf und kann zurückgeholt werden.`)) return;
  commit(b => b.update(docsRef().doc(d.id), { deleted: true, deletedAt: Date.now(), deletedBy: myName() }), `hat das Dokument „${d.name}“ gelöscht`)
    .then(() => toast("Dokument gelöscht"));
  viewer.close();
};

/* ---------- Programmpunkt anlegen / bearbeiten ---------- */
const planDlg = $("#planSheet"), PF = $("#planForm");
let psheet = null;
function setPlanType(t) {
  psheet.type = t;
  $$("#planTypes button").forEach(b => b.setAttribute("aria-pressed", b.dataset.type === t));
  PF.title.placeholder = PLAN_TYPES[t].ph;
}
function renderPlanDocs() {
  const docs = activeDocs();
  $("#planDocs").innerHTML = docs.length
    ? docs.map(d => `<label class="srow"><input type="checkbox" data-pd="${d.id}" ${psheet.docs.has(d.id) ? "checked" : ""}><span>${docIcon(d)} ${esc(d.name)}</span></label>`).join("")
    : `<p class="hint">Noch keine Dokumente in dieser Gruppe.</p>`;
}
function openPlan(p) {
  const editable = isOpen() && !!myName();
  psheet = { prev: p || null, type: p ? p.type : "activity", docs: new Set(p ? p.docIds || [] : []) };
  PF.title.value = p ? p.title : "";
  PF.date.value = p ? p.date || "" : "";
  PF.time.value = p ? p.time || "" : "";
  PF.endDate.value = p ? p.endDate || "" : "";
  PF.endTime.value = p ? p.endTime || "" : "";
  PF.place.value = p ? p.place || "" : "";
  PF.note.value = p ? p.note || "" : "";
  setPlanType(psheet.type);
  renderPlanDocs();
  $("#planFields").disabled = !editable;
  $("#planTitle").textContent = !p ? "Neuer Programmpunkt" : editable ? "Programmpunkt bearbeiten" : "Programmpunkt";
  $("#planDel").hidden = !p || !editable;
  $("#planSave").hidden = !editable;
  $("#planCancel").textContent = editable ? "Abbrechen" : "Schließen";
  $("#planErr").textContent = "";
  planDlg.showModal();
}
$$("#planTypes button").forEach(b => b.onclick = () => setPlanType(b.dataset.type));
$("#planDocs").addEventListener("change", e => {
  const id = e.target.dataset.pd; if (!id) return;
  e.target.checked ? psheet.docs.add(id) : psheet.docs.delete(id);
});
$("#planUpload").addEventListener("change", async e => {
  const files = [...e.target.files]; e.target.value = "";
  for (const f of files) { const id = await uploadDoc(f); if (id) psheet.docs.add(id); }
  setTimeout(renderPlanDocs, 300);
});
$("#planCancel").onclick = () => planDlg.close();
planDlg.addEventListener("click", e => { if (e.target === planDlg) planDlg.close(); });
$("#planDel").onclick = () => {
  const p = psheet.prev; if (!p || !confirm(`„${p.title}“ aus dem Reiseplan löschen?`)) return;
  commit(b => b.update(planRef().doc(p.id), { deleted: true, deletedAt: Date.now(), deletedBy: myName() }), `hat „${p.title}“ aus dem Reiseplan gelöscht`);
  planDlg.close();
};
PF.onsubmit = e => {
  e.preventDefault();
  const title = PF.title.value.trim();
  if (!title) return $("#planErr").textContent = "Gib dem Programmpunkt einen Titel.";
  if (PF.endDate.value && PF.date.value && PF.endDate.value < PF.date.value) return $("#planErr").textContent = "Das Ende liegt vor dem Beginn.";
  const prev = psheet.prev;
  const data = {
    type: psheet.type, title, date: PF.date.value, time: PF.time.value, endDate: PF.endDate.value, endTime: PF.endTime.value,
    place: PF.place.value.trim(), note: PF.note.value.trim(), docIds: [...psheet.docs].filter(id => state.docs.some(d => d.id === id)),
    createdAt: prev ? prev.createdAt : Date.now(), createdBy: prev ? prev.createdBy || "" : myName(), deleted: false
  };
  if (prev) { data.updatedAt = Date.now(); data.updatedBy = myName(); }
  const when = data.date ? ` (${fmtShortDay(data.date)}${data.time ? " " + data.time : ""})` : "";
  const ref = prev ? planRef().doc(prev.id) : planRef().doc();
  commit(b => b.set(ref, data), prev ? `hat „${title}“ im Reiseplan geändert${when}` : `hat „${title}“${when} zum Reiseplan hinzugefügt`);
  planDlg.close();
  toast(prev ? "Gespeichert" : "Zum Reiseplan hinzugefügt");
};

function bindTravel() {
  const ap = $("#addPlan"); if (ap) ap.onclick = () => { if (!needMe()) openPlan(); };
  $$("[data-plan]").forEach(b => b.onclick = () => openPlan(state.plan.find(p => p.id === b.dataset.plan)));
  $$("main [data-doc]").forEach(b => b.onclick = () => openDoc(b.dataset.doc));
  const up = $("#docUpload");
  if (up) up.parentElement.onclick = e => { if (e.target === up) return; if (needMe()) e.preventDefault(); };
  if (up) up.onchange = async e => {
    if (needMe()) { e.target.value = ""; return; }
    const files = [...e.target.files]; e.target.value = "";
    const st = $("#upState");
    for (const f of files) { if (st) st.textContent = `Lade „${f.name}“ hoch …`; await uploadDoc(f); }
    if (st) st.textContent = "";
  };
  const ao = $("#allOffline");
  if (ao) ao.onclick = async () => {
    ao.disabled = true; ao.textContent = "Wird gespeichert …";
    let ok = 0; const docs = activeDocs();
    for (const d of docs) { try { await loadDoc(d); ok++; } catch {} }
    toast(`${ok} von ${docs.length} Dokumenten offline verfügbar`);
    renderGroup();
  };
}

route();
</script>
